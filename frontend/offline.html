<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Conectando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle at center, #0e1626 0%, #05080e 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .portal-glow {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }
        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(0, 240, 255, 0.15);
            border-top: 3px solid #00f0ff;
            border-right: 3px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }
        .portal-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0.7; }
            to { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }
        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin-bottom: 10px;
        }
        .message {
            font-size: 14px;
            color: #94a3b8;
            max-width: 320px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .reconnect-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            color: #00f0ff;
            margin-bottom: 24px;
        }
        .dot-blink {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: blink 1s ease infinite;
        }
        @keyframes blink {
            50% { opacity: 0.3; }
        }
        .btn-retry {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 140, 255, 0.55));
            border: 1.2px solid #00f0ff;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
            transition: all 0.2s ease;
            outline: none;
        }
        .btn-retry:active {
            transform: scale(0.96);
            background: #00f0ff;
            color: #020617;
        }
    </style>
</head>
<body>

    <div class="portal-glow">
        <div class="spinner"></div>
        <div class="portal-core"></div>
    </div>

    <div class="title">ANI-DIMENSION</div>
    <div class="message">Sincronizando con el servidor central... Por favor espera un momento.</div>

    <div class="reconnect-badge">
        <div class="dot-blink"></div>
        <span>Reconectando en <b id="countdown">3</b>s</span>
    </div>

    <button class="btn-retry" onclick="reconnectNow()">Reintentar Ahora</button>

    <script>
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');

        function reconnectNow() {
            countdownEl.innerText = '...';
            // Intentar recargar hacia el servidor
            window.location.href = window.location.origin && window.location.origin.startsWith('http')
                ? window.location.origin
                : 'https://anidimension.online';
        }

        const timer = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(timer);
                reconnectNow();
            } else {
                countdownEl.innerText = seconds;
            }
        }, 1000);
    </script>
</body>
</html>
