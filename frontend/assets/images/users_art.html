<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 350px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #06172e 0%, #030a17 60%, #01040a 100%);
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 150px;
    background: 
      linear-gradient(to top, rgba(0, 240, 255, 0.25), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0, 240, 255, 0.12) 15px, rgba(0, 240, 255, 0.12) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0, 240, 255, 0.1) 30px, rgba(0, 240, 255, 0.1) 31px);
    transform: perspective(300px) rotateX(45deg);
    transform-origin: bottom;
  }
  .glow {
    position: absolute;
    width: 460px;
    height: 260px;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
  }
  .matrix-box {
    position: relative;
    z-index: 2;
    width: 530px;
    height: 250px;
    border: 1.5px solid rgba(0, 240, 255, 0.65);
    background: rgba(4, 14, 30, 0.85);
    box-shadow: 0 0 35px rgba(0, 240, 255, 0.35), inset 0 0 25px rgba(0, 240, 255, 0.15);
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    backdrop-filter: blur(8px);
  }
  .top-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 240, 255, 0.3);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  .top-status-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #00f0ff;
    letter-spacing: 1.5px;
  }
  .top-status-badge {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid #10b981;
    color: #10b981;
    padding: 2px 8px;
  }
  .cards-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex: 1;
  }
  .duelist-card-item {
    flex: 1;
    background: rgba(10, 25, 48, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.4);
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.12);
  }
  .avatar-circle {
    width: 52px;
    height: 52px;
    border: 2px solid #00f0ff;
    background: radial-gradient(circle, #0e305c, #061427);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.4);
  }
  .avatar-icon {
    font-size: 26px;
    color: #fff;
  }
  .duelist-nick {
    font-family: 'Orbitron', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;
  }
  .duelist-role {
    font-size: 8px;
    color: #38bdf8;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .duelist-stat {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    color: #10b981;
    background: rgba(16, 185, 129, 0.15);
    padding: 2px 6px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid-floor"></div>
  <div class="matrix-box">
    <div class="top-status">
      <span class="top-status-title">ANI DIMENSION • DUELIST DATABASE</span>
      <span class="top-status-badge">ONLINE • 1,420 USERS</span>
    </div>
    <div class="cards-row">
      <div class="duelist-card-item">
        <div class="avatar-circle"><span class="avatar-icon">👑</span></div>
        <div class="duelist-nick">Admin</div>
        <div class="duelist-role">Super Admin</div>
        <div class="duelist-stat">LV. 100 • OCG</div>
      </div>
      <div class="duelist-card-item" style="border-color: rgba(255, 215, 0, 0.5);">
        <div class="avatar-circle" style="border-color: #ffd700;"><span class="avatar-icon">⚡</span></div>
        <div class="duelist-nick" style="color: #ffd700;">SetoKaiba</div>
        <div class="duelist-role" style="color: #fbbf24;">Duel Master</div>
        <div class="duelist-stat" style="color: #ffd700; background: rgba(255,215,0,0.15);">342 VIC</div>
      </div>
      <div class="duelist-card-item">
        <div class="avatar-circle"><span class="avatar-icon">⚔️</span></div>
        <div class="duelist-nick">YugiMuto</div>
        <div class="duelist-role">Pro Duelist</div>
        <div class="duelist-stat">LV. 95 • OCG</div>
      </div>
    </div>
  </div>
</body>
</html>
