<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 450px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0d1e38 0%, #060e1c 55%, #02060d 100%);
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  .grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background: 
      linear-gradient(to top, rgba(0, 240, 255, 0.15), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0, 240, 255, 0.1) 15px, rgba(0, 240, 255, 0.1) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0, 240, 255, 0.08) 30px, rgba(0, 240, 255, 0.08) 31px);
    transform: perspective(300px) rotateX(45deg);
    transform-origin: bottom;
  }

  .glow-ambient {
    position: absolute;
    width: 450px;
    height: 250px;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
    top: 40px;
  }

  .showcase {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    height: 290px;
    width: 100%;
    margin-top: 15px;
  }

  /* Booster Pack Foil Style */
  .booster-pack {
    width: 140px;
    height: 230px;
    position: absolute;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 240, 255, 0.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 8px 6px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  /* Top and bottom crimped foil edges */
  .crimp-edge {
    width: 100%;
    height: 12px;
    background: repeating-linear-gradient(90deg, #94a3b8 0px, #cbd5e1 3px, #64748b 6px);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
  }

  /* Foil shine overlay */
  .foil-shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(125deg, transparent 30%, rgba(255, 255, 255, 0.25) 45%, transparent 60%);
    pointer-events: none;
    z-index: 5;
  }

  /* Left Booster Pack (Blue Eyes Cybernetic Burst) */
  .pack-left {
    transform: translateX(-115px) translateY(12px) rotate(-12deg) scale(0.92);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.3);
    z-index: 1;
    background: linear-gradient(180deg, #092540 0%, #051322 100%);
    border-color: #00f0ff;
  }

  /* Right Booster Pack (Gold Dragon Emperor) */
  .pack-right {
    transform: translateX(115px) translateY(12px) rotate(12deg) scale(0.92);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.3);
    z-index: 1;
    background: linear-gradient(180deg, #3d2605 0%, #170d00 100%);
    border-color: #ffd700;
  }

  /* Center Booster Pack (Legendary Ani Dimension Pack) */
  .pack-center {
    transform: translateY(-8px) scale(1.06);
    z-index: 3;
    border-color: #38bdf8;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 240, 255, 0.6);
    background: linear-gradient(180deg, #0f2c4c 0%, #061529 100%);
  }

  .pack-header-badge {
    font-family: 'Orbitron', sans-serif;
    font-size: 7px;
    font-weight: 900;
    color: #fff;
    background: #0284c7;
    padding: 2px 6px;
    letter-spacing: 1px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .pack-right .pack-header-badge {
    background: #b45309;
  }

  .pack-art {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px;
    position: relative;
  }

  .pack-logo-img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
  }

  .pack-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    letter-spacing: 1px;
    margin-top: 6px;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
  }

  .pack-edition {
    font-size: 7px;
    font-weight: 700;
    color: #7dd3fc;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .pack-footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 4px 4px 4px;
    font-size: 6.5px;
    font-weight: 700;
    color: #94a3b8;
  }

  /* Pedestal bar */
  .pedestal {
    z-index: 4;
    margin-top: 10px;
    background: linear-gradient(90deg, transparent, rgba(9, 23, 44, 0.95) 20%, rgba(9, 23, 44, 0.95) 80%, transparent);
    border-top: 2px solid #00f0ff;
    border-bottom: 1px solid rgba(0, 240, 255, 0.4);
    padding: 8px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
  }

  .pedestal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
  }

  .pedestal-sub {
    font-size: 9px;
    color: #38bdf8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="glow-ambient"></div>
  <div class="grid-floor"></div>

  <div class="showcase">
    <!-- Left Pack: Dragon Burst -->
    <div class="booster-pack pack-left">
      <div class="foil-shine"></div>
      <div class="crimp-edge"></div>
      <div class="pack-header-badge">EDICIÓN EXPEDICIÓN</div>
      <div class="pack-art">
        <img src="blue_eyes_dragon.png" style="width:75px; height:75px; object-fit:contain; filter:drop-shadow(0 0 6px rgba(0,240,255,0.6));">
        <div class="pack-title">CYBER DRAGON</div>
        <div class="pack-edition">ANI DIMENSION OCG</div>
      </div>
      <div class="pack-footer">
        <span>5 CARTAS</span>
        <span>OFICIAL</span>
      </div>
      <div class="crimp-edge"></div>
    </div>

    <!-- Center Pack: Official AD Booster Pack -->
    <div class="booster-pack pack-center">
      <div class="foil-shine"></div>
      <div class="crimp-edge"></div>
      <div class="pack-header-badge">ORIGINAL EDITION</div>
      <div class="pack-art">
        <img src="ad-logo.svg" class="pack-logo-img">
        <div class="pack-title" style="font-size:10px;">DIMENSIONAL NEXUS</div>
        <div class="pack-edition" style="color:#38bdf8;">ANI DIMENSION SERIES 1</div>
      </div>
      <div class="pack-footer">
        <span style="color:#38bdf8;">⭐ 9 CARTAS</span>
        <span style="color:#fff;">1ST ED.</span>
      </div>
      <div class="crimp-edge"></div>
    </div>

    <!-- Right Pack: Gold Phoenix Pack -->
    <div class="booster-pack pack-right">
      <div class="foil-shine"></div>
      <div class="crimp-edge"></div>
      <div class="pack-header-badge">COLECCIONISTA</div>
      <div class="pack-art">
        <img src="red_eyes_dragon.png" style="width:75px; height:75px; object-fit:contain; filter:drop-shadow(0 0 6px rgba(255,215,0,0.6));">
        <div class="pack-title" style="color:#fde047;">CHAOS EMPEROR</div>
        <div class="pack-edition" style="color:#fbbf24;">ANI DIMENSION OCG</div>
      </div>
      <div class="pack-footer">
        <span style="color:#fde047;">5 CARTAS</span>
        <span style="color:#ffd700;">ELITE</span>
      </div>
      <div class="crimp-edge"></div>
    </div>
  </div>

  <div class="pedestal">
    <div class="pedestal-title">SOBRES DE CARTAS ANI DIMENSION</div>
    <div class="pedestal-sub">PACKS OFICIALES • EXPANSIÓN DIMENSIONAL OCG</div>
  </div>
</body>
</html>
