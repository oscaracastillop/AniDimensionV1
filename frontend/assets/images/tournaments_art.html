<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 350px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #15263d 0%, #081120 60%, #02060e 100%);
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .stadium-beams {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 0%, rgba(0, 240, 255, 0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 0%, rgba(255, 215, 0, 0.35) 0%, transparent 50%);
  }

  .grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 150px;
    background: 
      linear-gradient(to top, rgba(0, 240, 255, 0.2), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0, 240, 255, 0.1) 15px, rgba(0, 240, 255, 0.1) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0, 240, 255, 0.08) 30px, rgba(0, 240, 255, 0.08) 31px);
    transform: perspective(300px) rotateX(45deg);
    transform-origin: bottom;
  }

  .trophy-stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .trophy-box {
    width: 90px;
    height: 90px;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
    margin-bottom: 5px;
  }

  .title-championship {
    font-family: 'Orbitron', sans-serif;
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.9), 0 0 20px rgba(0, 240, 255, 0.5);
  }

  .subtitle-championship {
    font-size: 10px;
    color: #ffd700;
    font-weight: 800;
    letter-spacing: 2.5px;
    margin-top: 3px;
    text-transform: uppercase;
  }

  .brackets-preview {
    margin-top: 15px;
    display: flex;
    gap: 15px;
    align-items: center;
  }

  .bracket-pill {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.4);
    padding: 4px 12px;
    font-size: 9px;
    color: #38bdf8;
    font-weight: 700;
    letter-spacing: 1px;
    font-family: 'Orbitron', sans-serif;
  }

  .bracket-gold {
    background: rgba(255, 215, 0, 0.15);
    border-color: rgba(255, 215, 0, 0.6);
    color: #ffd700;
  }
</style>
</head>
<body>
  <div class="stadium-beams"></div>
  <div class="grid-floor"></div>

  <div class="trophy-stage">
    <div style="display:flex; align-items:center; gap:20px; margin-bottom:10px;">
      <div style="font-family:'Orbitron'; font-size:11px; color:#00f0ff; letter-spacing:1.5px; font-weight:800;">TOP 8 BRACKETS</div>
      <img src="ad-logo.svg" style="width:70px; height:70px; filter:drop-shadow(0 0 12px rgba(0,240,255,0.8));">
      <div style="font-family:'Orbitron'; font-size:11px; color:#ffd700; letter-spacing:1.5px; font-weight:800;">GRAN FINAL OCG</div>
    </div>

    <div class="title-championship">ANI DIMENSION CHAMPIONSHIP</div>
    <div class="subtitle-championship">LIGA DE TORNEOS COMPETITIVOS</div>

    <div class="brackets-preview">
      <div class="bracket-pill">ELIMINATORIAS</div>
      <div class="bracket-pill bracket-gold">🏆 COPA DIMENSIONAL</div>
      <div class="bracket-pill">SALAS SUIZAS</div>
    </div>
  </div>
</body>
</html>
