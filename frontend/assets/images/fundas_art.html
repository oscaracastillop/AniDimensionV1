<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 450px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0d1e38 0%, #060e1c 55%, #02060d 100%);
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  /* Cyber grid on floor */
  .grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background: 
      linear-gradient(to top, rgba(0, 240, 255, 0.15), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0, 240, 255, 0.1) 15px, rgba(0, 240, 255, 0.1) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0, 240, 255, 0.08) 30px, rgba(0, 240, 255, 0.08) 31px);
    transform: perspective(300px) rotateX(45deg);
    transform-origin: bottom;
  }

  .glow-ambient {
    position: absolute;
    width: 400px;
    height: 250px;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
    top: 50px;
  }

  .showcase {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    height: 290px;
    width: 100%;
    margin-top: 15px;
  }

  /* Card Sleeve Base */
  .card-sleeve {
    width: 150px;
    height: 220px;
    border-radius: 6px;
    position: absolute;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(0, 240, 255, 0.5);
    background: #091322;
  }

  /* Left card (Gold Dragon Swirl Back) */
  .card-left {
    transform: translateX(-110px) translateY(10px) rotate(-14deg) scale(0.9);
    border-color: rgba(255, 215, 0, 0.5);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.3);
    z-index: 1;
    background: radial-gradient(circle, #3d1f05 0%, #170900 70%, #0a0300 100%);
  }

  /* Right card (Obsidian Violet Back) */
  .card-right {
    transform: translateX(110px) translateY(10px) rotate(14deg) scale(0.9);
    border-color: rgba(168, 85, 247, 0.5);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(168, 85, 247, 0.3);
    z-index: 1;
    background: radial-gradient(circle, #25083a 0%, #11031d 70%, #07000c 100%);
  }

  /* Center card (Official Cyber AD Logo Back) */
  .card-center {
    transform: translateY(-8px) scale(1.05);
    z-index: 3;
    border-color: #00f0ff;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 240, 255, 0.6);
    background: radial-gradient(circle at 50% 50%, #0e2b4d 0%, #061222 70%, #02070f 100%);
  }

  .sleeve-border {
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .card-left .sleeve-border {
    border-color: rgba(255, 215, 0, 0.4);
  }
  .card-right .sleeve-border {
    border-color: rgba(168, 85, 247, 0.4);
  }

  .center-logo-img {
    width: 95px;
    height: 95px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8));
  }

  /* Pedestal bar */
  .pedestal {
    z-index: 4;
    margin-top: 10px;
    background: linear-gradient(90deg, transparent, rgba(9, 23, 44, 0.95) 20%, rgba(9, 23, 44, 0.95) 80%, transparent);
    border-top: 2px solid #00f0ff;
    border-bottom: 1px solid rgba(0, 240, 255, 0.4);
    padding: 8px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
  }

  .pedestal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
  }

  .pedestal-sub {
    font-size: 9px;
    color: #38bdf8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="glow-ambient"></div>
  <div class="grid-floor"></div>

  <div class="showcase">
    <!-- Left Card: Dragon Gold Sleeve -->
    <div class="card-sleeve card-left">
      <div class="sleeve-border">
        <div style="font-family:'Orbitron'; font-size:9px; color:#ffd700; letter-spacing:1px; margin-bottom:8px; font-weight:800;">ANI DIMENSION</div>
        <img src="card_back.jpg" style="width:75px; height:110px; border-radius:3px; opacity:0.85;">
        <div style="font-size:7px; color:#fde047; margin-top:8px; letter-spacing:1px;">CLASSIC REVERSO</div>
      </div>
    </div>

    <!-- Center Card: Official Cyber AD Sleeve -->
    <div class="card-sleeve card-center">
      <div class="sleeve-border">
        <img src="ad-logo.svg" class="center-logo-img">
        <div style="font-family:'Orbitron'; font-size:8px; color:#00f0ff; letter-spacing:1.5px; font-weight:800; margin-top:10px;">REVERSO OFICIAL</div>
        <div style="font-size:6.5px; color:#94a3b8; letter-spacing:0.5px; margin-top:2px;">CUSTOM CARD BACK</div>
      </div>
    </div>

    <!-- Right Card: Obsidian Purple Sleeve -->
    <div class="card-sleeve card-right">
      <div class="sleeve-border">
        <div style="font-family:'Orbitron'; font-size:9px; color:#c084fc; letter-spacing:1px; margin-bottom:8px; font-weight:800;">ANI DIMENSION</div>
        <img src="ad-logo.svg" style="width:70px; height:70px; opacity:0.8; filter: hue-rotate(90deg);">
        <div style="font-size:7px; color:#e879f9; margin-top:8px; letter-spacing:1px;">COSMIC REVERSO</div>
      </div>
    </div>
  </div>

  <div class="pedestal">
    <div class="pedestal-title">FUNDAS &amp; REVERSOS DE CARTAS</div>
    <div class="pedestal-sub">PERSONALIZACIÓN DE DECK • ANI DIMENSION OCG</div>
  </div>
</body>
</html>
