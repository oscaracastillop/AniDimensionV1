<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 350px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #0c203b 0%, #06101e 60%, #02060d 100%);
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 150px;
    background: 
      linear-gradient(to top, rgba(0, 240, 255, 0.2), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0, 240, 255, 0.1) 15px, rgba(0, 240, 255, 0.1) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(0, 240, 255, 0.08) 30px, rgba(0, 240, 255, 0.08) 31px);
    transform: perspective(300px) rotateX(45deg);
    transform-origin: bottom;
  }

  .glow {
    position: absolute;
    width: 450px;
    height: 250px;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, transparent 70%);
  }

  /* Hologram Display */
  .holo-container {
    position: relative;
    z-index: 2;
    width: 520px;
    height: 240px;
    border: 1.5px solid rgba(0, 240, 255, 0.6);
    background: rgba(6, 17, 34, 0.75);
    box-shadow: 0 0 35px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .holo-top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 240, 255, 0.3);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .holo-logo {
    width: 75px;
    height: 75px;
    filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.9));
  }

  .card-columns {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
  }

  .card-holo-frame {
    width: 65px;
    height: 95px;
    border: 1.5px solid #00f0ff;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    background: #091a30;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .pedestal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
  }

  .pedestal-sub {
    font-size: 10px;
    color: #38bdf8;
    letter-spacing: 2px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid-floor"></div>

  <div class="holo-container">
    <div class="holo-top-bar">
      <div style="font-family:'Orbitron'; font-size:10px; color:#00f0ff; font-weight:800; letter-spacing:1px;">CATÁLOGO DATABASE</div>
      <div style="font-size:9px; color:#94a3b8;">12,000+ CARTAS REGISTRADAS</div>
    </div>

    <div style="display:flex; align-items:center; gap:25px;">
      <div class="card-holo-frame" style="transform: rotate(-6deg);">
        <img src="blue_eyes_dragon.png" style="width:55px; height:55px; object-fit:contain;">
      </div>

      <div style="display:flex; flex-direction:column; align-items:center;">
        <img src="ad-logo.svg" class="holo-logo">
        <div class="pedestal-title" style="margin-top:6px;">ANI DIMENSION</div>
        <div class="pedestal-sub">OFICIAL CARD DATABASE</div>
      </div>

      <div class="card-holo-frame" style="transform: rotate(6deg); border-color:#ffd700; box-shadow:0 0 15px rgba(255,215,0,0.4);">
        <img src="red_eyes_dragon.png" style="width:55px; height:55px; object-fit:contain;">
      </div>
    </div>

    <div style="margin-top:14px; font-size:9.5px; color:#64748b; letter-spacing:1px;">
      BUSCADOR INTELIGENTE • DETALLES OCG • SINERGIA DE ATRIBUTOS
    </div>
  </div>
</body>
</html>
