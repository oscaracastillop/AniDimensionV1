<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Outfit:wght@600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 250px;
    height: 400px;
    overflow: hidden;
    background: transparent !important;
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* SOBRE FOIL VACANO Y ELEGANTE SIN BORDES EXTERNOS */
  .booster-pack {
    position: relative;
    width: 235px;
    height: 385px;
    background: radial-gradient(circle at 50% 30%, #0d2a4a 0%, #061528 55%, #02070f 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 0;
    overflow: hidden;
    border-left: 1px solid rgba(0, 240, 255, 0.35);
    border-right: 1px solid rgba(0, 240, 255, 0.35);
    border-top: none;
    border-bottom: none;
  }

  /* BORDES METALIZADOS SELLADOS (TOP & BOTTOM FOIL CRIMP) */
  .crimp-top {
    width: 100%;
    height: 18px;
    background: repeating-linear-gradient(90deg, #94a3b8 0px, #ffffff 3px, #475569 6px, #1e293b 9px);
    clip-path: polygon(0% 0%, 4% 100%, 8% 0%, 12% 100%, 16% 0%, 20% 100%, 24% 0%, 28% 100%, 32% 0%, 36% 100%, 40% 0%, 44% 100%, 48% 0%, 52% 100%, 56% 0%, 60% 100%, 64% 0%, 68% 100%, 72% 0%, 76% 100%, 80% 0%, 84% 100%, 88% 0%, 92% 100%, 96% 0%, 100% 100%);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.9);
    flex-shrink: 0;
  }

  .crimp-bottom {
    width: 100%;
    height: 18px;
    background: repeating-linear-gradient(90deg, #94a3b8 0px, #ffffff 3px, #475569 6px, #1e293b 9px);
    clip-path: polygon(0% 100%, 4% 0%, 8% 100%, 12% 0%, 16% 100%, 20% 0%, 24% 100%, 28% 0%, 32% 100%, 36% 0%, 40% 100%, 44% 0%, 48% 100%, 52% 0%, 56% 100%, 60% 0%, 64% 100%, 68% 0%, 72% 100%, 76% 0%, 80% 100%, 85% 0%, 90% 100%, 95% 0%, 100% 100%);
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }

  /* EFECTO DE LUZ HOLOGRÁFICA Y DESTELLO */
  .foil-shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 25%, rgba(255, 255, 255, 0.3) 45%, rgba(0, 240, 255, 0.25) 52%, transparent 65%);
    pointer-events: none;
    z-index: 10;
  }

  /* BANNER SUPERIOR CON TEXTO PERSONALIZADO ADMIN EN LUGAR DE KONAMI */
  .header-admin-badge {
    margin-top: 6px;
    background: linear-gradient(90deg, #f59e0b, #fde047);
    color: #0f172a;
    font-family: 'Orbitron', sans-serif;
    font-size: 8.5px;
    font-weight: 900;
    padding: 3px 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    box-shadow: 0 0 12px rgba(253, 224, 71, 0.8);
    border: 1px solid #ffffff;
    border-radius: 2px;
    z-index: 5;
    text-align: center;
    max-width: 92%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* CONTENEDOR DEL DRAGÓN BLANCO */
  .dragon-area {
    position: relative;
    width: 100%;
    height: 215px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .dragon-glow {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.5) 0%, rgba(0, 140, 255, 0.2) 60%, transparent 80%);
    z-index: 1;
  }

  .dragon-img {
    width: 210px;
    height: 210px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.85));
  }

  .pack-text-block {
    text-align: center;
    z-index: 5;
    margin-bottom: 2px;
  }

  .main-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13.5px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 10px #00f0ff, 0 0 18px #00f0ff;
    letter-spacing: 0.5px;
  }

  .sub-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 800;
    color: #ffd700;
    letter-spacing: 1.5px;
    margin-top: 2px;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
  }

  .pack-bottom-text {
    font-size: 7.5px;
    color: #94a3b8;
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    z-index: 5;
  }
</style>
</head>
<body style="background:transparent;">

<div class="booster-pack">
  <div class="crimp-top"></div>
  <div class="foil-shine"></div>

  <!-- TEXTO DE OFERTA PERSONALIZABLE EN LUGAR DE KONAMI -->
  <div class="header-admin-badge" id="admin-badge-text">
    ¡EDICIÓN 1RA TEMPORADA!
  </div>

  <div class="dragon-area">
    <div class="dragon-glow"></div>
    <img src="blue_eyes_dragon.png" class="dragon-img">
  </div>

  <div class="pack-text-block">
    <div class="main-title">LEGEND OF BLUE EYES</div>
    <div class="sub-title">WHITE DRAGON</div>
  </div>

  <div class="pack-bottom-text">ANI-DIMENSION • 4 CARDS PER PACK</div>

  <div class="crimp-bottom"></div>
</div>

</body>
</html>
