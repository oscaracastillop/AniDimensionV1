<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension Online - Iniciando...</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0e1626 0%, #05080e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        .splash-loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--accent-cyan, #00f0ff);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            margin-bottom: 8px;
        }

        .splash-subtitle {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="splash-loader"></div>
    <div class="splash-title">ANI-DIMENSION</div>
    <div class="splash-subtitle">Iniciando el portal dimensional...</div>

    <script src="js/core/session.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.Session && window.Session.isLoggedIn()) {
                    window.location.replace('views/lobby/lobby.html');
                } else {
                    window.location.replace('views/login/login.html');
                }
            }, 300);
        });
    </script>
</body>
</html>
