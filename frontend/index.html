<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension Online - Iniciando...</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0e1626 0%, #05080e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        .splash-loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--accent-cyan, #00f0ff);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            margin-bottom: 8px;
        }

        .splash-subtitle {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <img src="assets/images/logo.png" alt="Ani-Dimension" style="width:120px; height:auto; margin-bottom:16px; filter:drop-shadow(0 0 20px rgba(0,240,255,0.75));">
    <div class="splash-loader"></div>
    <div class="splash-title">ANI-DIMENSION</div>
    <div class="splash-subtitle">Iniciando el portal dimensional...</div>

    <script src="js/core/session.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Detección estricta de entorno nativo Android APK / Capacitor / WebView
            const urlParams = new URLSearchParams(window.location.search);
            const isApkSource = urlParams.get('source') === 'apk' || urlParams.get('platform') === 'android';
            const isCapacitor = typeof window.Capacitor !== 'undefined' || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
            const isCordova = typeof window.cordova !== 'undefined';
            const isAndroidWebView = /Android.*(wv|Version\/[0-9.]+\s+Chrome|Capacitor|AniDimension)/i.test(navigator.userAgent);

            const isApp = isApkSource || isCapacitor || isCordova || isAndroidWebView;

            if (isApp) {
                // EL APK NUNCA VE LA LANDING PAGE: Va directo a Login o Lobby
                if (window.Session && window.Session.isLoggedIn()) {
                    window.location.replace('views/lobby/lobby.html');
                } else {
                    window.location.replace('views/login/login.html');
                }
            } else {
                // NAVEGADORES WEB (anidimension.online desde PC / Celular): Muestra Landing Page oficial
                if (urlParams.get('play') === '1' || urlParams.get('direct') === '1') {
                    if (window.Session && window.Session.isLoggedIn()) {
                        window.location.replace('views/lobby/lobby.html');
                    } else {
                        window.location.replace('views/login/login.html');
                    }
                } else {
                    window.location.replace('landing.html');
                }
            }
        });
    </script>
</body>
</html>
