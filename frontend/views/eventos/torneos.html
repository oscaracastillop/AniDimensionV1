<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Torneos & Copas Oficiales</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css?v=5.0">
    <link rel="stylesheet" href="../../css/eventos.css?v=5.0">
    <link rel="stylesheet" href="../../css/brackets.css?v=6.0">
    <link rel="stylesheet" href="../../css/navbar.css?v=5.0">
    <style>
        .tournament-hub-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 15%, #0d1a2d 0%, #030712 100%);
            color: #fff;
            overflow: hidden;
            box-sizing: border-box;
            padding-bottom: 64px;
        }

        .tournament-hub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1.5px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
        }

        .t-hub-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .t-hub-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #00f0ff;
            letter-spacing: 0.8px;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .t-hub-subtitle {
            font-size: 10px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .tournament-tabs-bar {
            display: flex;
            gap: 10px;
            padding: 10px 20px 0 20px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }
        .hub-tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #cbd5e1;
            padding: 7px 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hub-tab-btn.active {
            background: rgba(0,240,255,0.2);
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 12px rgba(0,240,255,0.3);
        }

        .tournament-scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .tournaments-player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 18px;
        }

        .player-tournament-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1.2px solid rgba(0, 240, 255, 0.28);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: all 0.25s ease;
        }
        .player-tournament-card:hover {
            border-color: #00f0ff;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.25);
            transform: translateY(-2px);
        }

        .pt-card-header {
            position: relative;
            height: 130px;
            overflow: hidden;
        }
        .pt-card-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .pt-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15,23,42,0.1), rgba(15,23,42,0.95));
        }
        .pt-badge-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9.5px;
            font-weight: 800;
            padding: 3px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-registro { background: rgba(56, 189, 248, 0.25); border: 1px solid #38bdf8; color: #38bdf8; }
        .status-en_curso { background: rgba(234, 179, 8, 0.25); border: 1px solid #eab308; color: #facc15; animation: pulseGlow 1.5s infinite; }
        .status-finalizado { background: rgba(34, 197, 94, 0.25); border: 1px solid #22c55e; color: #4ade80; }

        .pt-card-body {
            padding: 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pt-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        .pt-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: #cbd5e1;
        }
        .pt-meta-pill {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .pt-prizes-box {
            background: rgba(0, 0, 0, 0.55);
            border: 1.2px dashed rgba(255, 215, 0, 0.5);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 11px;
            color: #ffd700;
            white-space: pre-line;
            line-height: 1.45;
            max-height: 95px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1);
        }

        .pt-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .btn-pt-action {
            flex: 1;
            min-width: 110px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-pt-primary { background: rgba(0,240,255,0.18); border: 1.2px solid #00f0ff; color: #00f0ff; }
        .btn-pt-primary:hover { background: #00f0ff; color: #020617; box-shadow: 0 0 14px rgba(0,240,255,0.5); }
        .btn-pt-gold { background: rgba(255,215,0,0.18); border: 1.2px solid #ffd700; color: #ffd700; }
        .btn-pt-gold:hover { background: #ffd700; color: #020617; box-shadow: 0 0 14px rgba(255,215,0,0.5); }
        .btn-pt-danger { background: rgba(255,71,87,0.18); border: 1.2px solid #ff4757; color: #ff4757; }
        .btn-pt-danger:hover { background: #ff4757; color: #fff; }

        /* Estilos del Árbol de Brackets (Llaves de Torneo) */
        .bracket-tree-container {
            display: flex;
            gap: 36px;
            overflow-x: auto;
            overflow-y: auto;
            padding: 20px 16px;
            align-items: stretch;
            min-height: 540px;
        }
        .bracket-tree-container::-webkit-scrollbar {
            height: 7px;
            width: 7px;
        }
        .bracket-tree-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 4px;
        }
        .bracket-tree-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #00f0ff, #3b82f6);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .bracket-round-col {
            min-width: 290px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
        }
        .round-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.16), rgba(15, 23, 42, 0.9));
            border: 1.2px solid rgba(0, 240, 255, 0.35);
            border-radius: 6px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }
        .round-title-bar.champion-header {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(15, 23, 42, 0.9));
            border-color: #ffd700;
        }
        .round-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 8.5px;
            font-weight: 800;
            background: rgba(0, 240, 255, 0.2);
            color: #00f0ff;
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 0.5px;
        }
        .round-title-bar.champion-header .round-tag {
            background: rgba(255, 215, 0, 0.25);
            color: #ffd700;
        }
        .round-title-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .round-matches-list {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex: 1;
            gap: 22px;
        }

        /* Grupos de parejas y llaves */
        .bracket-pair-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            justify-content: center;
        }
        .bracket-pair-group.has-connector {
            padding-right: 28px;
        }
        .bracket-pair-fork {
            position: absolute;
            right: 0;
            top: 22%;
            bottom: 22%;
            width: 28px;
            pointer-events: none;
        }
        .bracket-pair-fork::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 14px;
            border-right: 2px solid rgba(0, 240, 255, 0.45);
            border-top: 2px solid rgba(0, 240, 255, 0.45);
            border-bottom: 2px solid rgba(0, 240, 255, 0.45);
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        .bracket-pair-fork::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 14px;
            width: 14px;
            height: 0;
            border-top: 2px solid rgba(0, 240, 255, 0.45);
        }

        /* Enlace dorado de la Final a la Copa */
        .bracket-final-stem {
            position: absolute;
            right: -28px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            width: 28px;
            pointer-events: none;
        }
        .bracket-final-stem .stem-beam {
            flex: 1;
            height: 0;
            border-top: 2px solid #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        .bracket-final-stem .stem-arrow {
            color: #ffd700;
            font-size: 11px;
            margin-left: -2px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
        }

        /* Tarjeta de Combate */
        .match-node-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(8, 14, 28, 0.98));
            border: 1.3px solid rgba(0, 240, 255, 0.22);
            border-radius: 7px;
            padding: 9px 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        .match-node-card:hover {
            border-color: #00f0ff;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.25);
        }
        .match-node-card.live-duel {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.08), rgba(15, 23, 42, 0.96));
        }
        .match-node-card.my-match {
            border-color: #00f0ff;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }

        .match-node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9.5px;
            font-family: 'Orbitron', sans-serif;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 5px;
        }
        .match-badge-tag {
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }
        .match-status-pill {
            font-weight: 800;
            font-size: 8.5px;
            padding: 1.5px 6px;
            border-radius: 3px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .status-pill-live {
            background: rgba(234, 179, 8, 0.25);
            border: 1px solid #ffd700;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        .status-pill-live .live-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffd700;
            box-shadow: 0 0 6px #ffd700;
            animation: livePulse 1s infinite alternate;
        }
        @keyframes livePulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .status-pill-finished {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
        }
        .status-pill-pending {
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #94a3b8;
        }
        .status-pill-bye {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid #a855f7;
            color: #c084fc;
        }

        .match-player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 5px;
            font-size: 11.5px;
            transition: all 0.15s;
        }
        .match-player-row.winner-row {
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.05));
            border-color: rgba(34, 197, 94, 0.5);
            color: #fff;
        }
        .match-player-row.winner-row .player-score-box {
            background: #22c55e;
            color: #020617;
            border-color: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        .match-player-row.loser-row {
            opacity: 0.55;
        }
        .match-player-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #00f0ff;
            margin-right: 7px;
        }
        .match-player-avatar.winner-avatar {
            border-color: #ffd700;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }
        .player-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            font-size: 11px;
        }
        .player-name-text.me-highlight {
            color: #00f0ff;
            font-weight: 800;
        }
        .player-score-box {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 11px;
            min-width: 22px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            padding: 0 4px;
        }

        /* Columna y Tarjeta de la Copa de Campeón */
        .bracket-podium-col {
            min-width: 270px;
            max-width: 290px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .champion-podium-card {
            background: radial-gradient(circle at 50% 25%, rgba(255, 215, 0, 0.18) 0%, rgba(15, 23, 42, 0.95) 80%);
            border: 1.8px solid #ffd700;
            border-radius: 8px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.25), inset 0 0 20px rgba(255, 215, 0, 0.1);
            margin: auto 0;
            position: relative;
            animation: championCardGlow 3s infinite alternate;
        }
        @keyframes championCardGlow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
            100% { box-shadow: 0 0 35px rgba(255, 215, 0, 0.45); }
        }
        .trophy-glow-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .trophy-icon-large {
            font-size: 46px;
            filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
            animation: floatTrophy 2.5s ease-in-out infinite alternate;
        }
        @keyframes floatTrophy {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }
        .champion-badge-pill {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 4px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .champion-badge-pill.crowned {
            background: rgba(255, 215, 0, 0.25);
            border: 1.2px solid #ffd700;
            color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        .champion-badge-pill.dispute {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
        }
        .champion-user-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        .champion-sub-text {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .champion-reward-box {
            background: rgba(0,0,0,0.5);
            border: 1px dashed rgba(255,215,0,0.5);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 9.5px;
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Modal Styles */
        .hub-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .hub-modal-box {
            background: #0b1120;
            border: 1.5px solid #00f0ff;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
            width: 100%;
            max-width: 1180px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .hub-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
            background: rgba(0, 240, 255, 0.05);
        }
        .hub-modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: #00f0ff;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 8px rgba(234, 179, 8, 0.4); }
            50% { box-shadow: 0 0 16px rgba(234, 179, 8, 0.8); }
        }
    </style>
</head>
<body>

    <div class="tournament-hub-container">
        <!-- HEADER SUPERIOR -->
        <div class="tournament-hub-header">
            <div class="t-hub-title-box">
                <img src="../../assets/images/logo.png" alt="Ani-Dimension Logo" style="height:32px; width:auto; object-fit:contain;">
                <div>
                    <h1 class="t-hub-title">TORNEOS & COPAS OFICIALES</h1>
                    <div class="t-hub-subtitle">ÁRBOL DE LLAVES EN TIEMPO REAL • ESPECTAR DUELOS EN VIVO • SALÓN DE LA FAMA</div>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <div class="events-header-badge" id="user-stars-badge" style="font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; color:#ffd700; padding:4px 10px; background:rgba(255,215,0,0.12); border:1px solid rgba(255,215,0,0.3); border-radius:4px;">
                    ⭐ ---
                </div>
                <a href="/views/eventos/eventos.html" class="btn-pt-action" style="background:rgba(255,255,255,0.08); border:1.2px solid rgba(255,255,255,0.25); color:#fff; height:28px; padding:0 12px;">
                    VOLVER
                </a>
            </div>
        </div>

        <!-- PESTAÑAS: TORNEOS ACTIVOS vs SALÓN DE LA FAMA -->
        <div class="tournament-tabs-bar">
            <button class="hub-tab-btn active" onclick="setPlayerHubTab('ACTIVE', this)">🔥 TORNEOS ACTIVOS & INSCRIPCIONES</button>
            <button class="hub-tab-btn" onclick="setPlayerHubTab('HALL_OF_FAME', this)">🏛️ SALÓN DE LA FAMA & HISTÓRICOS</button>
        </div>

        <!-- CONTENEDOR CENTRAL DESLIZABLE -->
        <div class="tournament-scroll-content">

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div id="player-tab-heading" style="font-family:'Orbitron',sans-serif; font-size:12px; font-weight:800; color:#00f0ff;">
                    🏆 TORNEOS ACTIVOS Y PRÓXIMOS
                </div>
                <div id="torneos-player-counter" style="font-size:11px; color:#94a3b8;">
                    Cargando torneos...
                </div>
            </div>

            <!-- GRID DE TARJETAS DE TORNEO -->
            <div class="tournaments-player-grid" id="player-tournaments-grid">
                <!-- Se inyecta dinámicamente con torneos-hub.js -->
            </div>

        </div>
    </div>

    <!-- =========================================================================
         MODAL ÁRBOL DE LLAVES EN VIVO (JUGADORES Y ESPECTADORES)
         ========================================================================= -->
    <div id="modal-player-bracket-viewer" class="hub-modal-overlay" style="display:none;">
