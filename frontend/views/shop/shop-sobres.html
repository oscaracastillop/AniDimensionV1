<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Tienda de Sobres</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/shop.css?v=2.1">
    <link rel="stylesheet" href="shop.css?v=2.1">
    <link rel="stylesheet" href="../../css/navbar.css">
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="shop-page-container">
        <!-- HEADER FIJO CON BOTÓN VOLVER -->
        <div class="shop-header">
            <div class="shop-title-box">
                <a href="shop.html" class="btn-shop-back" title="Volver a la Tienda Principal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px; height:16px;"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </a>
                <div>
                    <h1 class="shop-title">CATÁLOGO DE SOBRES</h1>
                    <div class="shop-subtitle">BOOSTER PACKS Y EXPANSIONES REGLAMENTARIAS OCG</div>
                </div>
            </div>

            <div class="shop-balance-pill">
                <span>STARSHIPS:</span>
                <span id="shop-user-coins">⭐ 500</span>
            </div>
        </div>

        <!-- CONTENEDOR CENTRAL DESLIZABLE (LISTO PARA INYECTAR ÍTEMS) -->
        <div class="shop-scroll-content">
            <div class="shop-empty-category-container">
                <div class="shop-empty-icon" style="color:#10b981;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:100%; height:100%;">
                        <rect x="5" y="2" width="14" height="20" rx="2"></rect>
                        <line x1="5" y1="7" x2="19" y2="7"></line>
                        <circle cx="12" cy="14" r="3"></circle>
                    </svg>
                </div>
                <div class="shop-empty-title">CATÁLOGO DE SOBRES EN PREPARACIÓN</div>
                <div class="shop-empty-desc">
                    Aquí se mostrarán los sobres de cartas oficiales OCG, probabilidades de rareza y tirada de apertura.
                </div>
            </div>
        </div>
    </div>

    <!-- NAVBAR INFERIOR Y AUTENTICACIÓN -->
    <div id="navbar-container"></div>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/navbar.js"></script>
    <script src="../../js/data/packs-data.js"></script>
    <script src="../../js/views/shop.js"></script>
    <script src="../../js/views/shop-sobres.js"></script>
    <script>
        async function enforceLandscapeOrientation() {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ScreenOrientation) {
                    await window.Capacitor.Plugins.ScreenOrientation.lock({ orientation: 'landscape' });
                } else if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        document.addEventListener('DOMContentLoaded', () => {
            enforceLandscapeOrientation();
            if (window.AppNavbar) window.AppNavbar.init('tienda');
        });
    </script>
</body>
</html>
