<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Tienda de Fondos y Cosméticos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="../../css/navbar.css">
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/modal-utils.js"></script>
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="shop-page-container">
        <!-- HEADER FIJO CON BOTÓN VOLVER -->
        <div class="shop-header">
            <div class="shop-title-box">
                <img src="/assets/images/logo.png" alt="Ani-Dimension Logo" style="height:32px; width:auto; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,240,255,0.5));">
                <div>
                    <h1 class="shop-title">FONDOS Y COSMÉTICOS</h1>
                    <div class="shop-subtitle">BANNERS DE PERFIL, TÍTULOS HONORÍFICOS Y AURAS</div>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <div class="shop-balance-pill">
                    <span>STARSHIPS:</span>
                    <span id="shop-user-coins">⭐ ---</span>
                </div>
                <a href="shop.html" class="btn-shop-back" title="Volver a la Tienda Principal">
                    VOLVER
                </a>
            </div>
        </div>

        <!-- CONTENEDOR CENTRAL DESLIZABLE (LISTO PARA INYECTAR ÍTEMS) -->
        <div class="shop-scroll-content">
            <div class="shop-empty-category-container">
                <div class="shop-empty-icon" style="color:#60a5fa;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:100%; height:100%;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
                <div class="shop-empty-title">CATÁLOGO DE COSMÉTICOS EN PREPARACIÓN</div>
                <div class="shop-empty-desc">
                    Aquí podrás personalizar tu perfil con ilustraciones panorámicas, auras resplandecientes y títulos de torneo.
                </div>
            </div>
        </div>
    </div>

    <!-- NAVBAR INFERIOR Y AUTENTICACIÓN -->
    <div id="navbar-container"></div>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/navbar.js"></script>
    <script src="../../js/views/shop.js"></script>
    <script>
        async function enforceLandscapeOrientation() {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ScreenOrientation) {
                    await window.Capacitor.Plugins.ScreenOrientation.lock({ orientation: 'landscape' });
                } else if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        document.addEventListener('DOMContentLoaded', () => {
            enforceLandscapeOrientation();
            if (window.AppNavbar) window.AppNavbar.init('tienda');
        });
    </script>
</body>
</html>
