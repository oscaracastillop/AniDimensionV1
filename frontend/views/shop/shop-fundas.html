<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Tienda de Fundas y Reversos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css?v=4.5">
    <link rel="stylesheet" href="../../css/shop.css?v=4.5">
    <link rel="stylesheet" href="shop.css?v=4.5">
    <link rel="stylesheet" href="../../css/navbar.css?v=4.5">
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/modal-utils.js"></script>
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="shop-page-container">
        
        <!-- HEADER FIJO -->
        <div class="shop-header">
            <div class="shop-title-box">
                <img src="/assets/images/logo.png" alt="Ani-Dimension Logo" style="height:32px; width:auto; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,240,255,0.5));">
                <div>
                    <h1 class="shop-title">CATÁLOGO DE FUNDAS Y REVERSOS</h1>
                    <div class="shop-subtitle">PROTECTORES HOLOGRÁFICOS OFICIALES PARA TUS CARTAS - VITALICIOS</div>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <div class="shop-balance-pill">
                    <span>STARSHIPS:</span>
                    <span id="shop-user-coins">⭐ ---</span>
                </div>
                <a href="shop.html" class="btn-shop-back" title="Volver a la Tienda Principal">
                    VOLVER
                </a>
            </div>
        </div>

        <!-- BARRA DE FILTROS CÓSMICOS (MONEDA) -->
        <div class="shop-filter-bar">
            <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-family:'Orbitron', sans-serif; font-size:8px; font-weight:800; color:#ffd700; text-transform:uppercase;">
                    MONEDA:
                </span>
                <div class="filter-pills-group" id="filter-currency-group">
                    <button type="button" class="btn-filter-currency-pill active" onclick="setSleeveCurrencyFilter('ALL', this)">TODAS</button>
                    <button type="button" class="btn-filter-currency-pill" onclick="setSleeveCurrencyFilter('STARSHIPS', this)">⭐ STARSHIPS</button>
                    <button type="button" class="btn-filter-currency-pill" onclick="setSleeveCurrencyFilter('USD', this)">💵 DÓLARES ($)</button>
                </div>
            </div>
        </div>

        <!-- CONTENEDOR CENTRAL DESLIZABLE CON GRID DINÁMICO DE CARDS -->
        <div class="shop-scroll-content">
            <div id="shop-fundas-grid" class="shop-cosmetics-grid" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:12px 10px 40px 10px;">
                <!-- Se inyectan dinámicamente las cards -->
            </div>
        </div>

    </div>

    <!-- MODAL DE CONFIRMACIÓN DE COMPRA EN STARSHIPS -->
    <div id="shop-sleeve-confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(3,7,18,0.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
        <div style="background:#070d1b; border:1.5px solid #ffd700; box-shadow:0 0 35px rgba(255,215,0,0.3), 0 10px 40px rgba(0,0,0,0.85); width:100%; max-width:440px; padding:22px 20px; text-align:center; box-sizing:border-box; color:#fff;">
            <div style="font-family:'Orbitron', sans-serif; font-size:13px; font-weight:900; color:#ffd700; letter-spacing:0.5px; margin-bottom:4px;">
                CONFIRMAR COMPRA DE FUNDA
            </div>
            
            <div id="modal-sleeve-buy-details" style="background:rgba(0,0,0,0.55); border:1px solid rgba(255,215,0,0.3); padding:12px; margin:12px 0; text-align:center; font-size:11px; line-height:1.5;">
                <!-- Dinámico -->
            </div>

            <div style="font-size:9.5px; color:#94a3b8; margin-bottom:18px; line-height:1.4;">
                Las fundas son <b>vitalicias</b> y se aplicarán al reverso de tu Deck Principal, Extra Deck y cartas boca abajo.
            </div>

            <div style="display:flex; justify-content:center; gap:10px;">
                <button type="button" onclick="closeSleeveConfirmModal()" style="padding:7px 16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#cbd5e1; font-family:'Orbitron', sans-serif; font-size:9px; font-weight:500; cursor:pointer;">
                    CANCELAR
                </button>
                <button id="btn-modal-confirm-sleeve-buy" type="button" style="padding:7px 20px; background:linear-gradient(135deg, #ffd700 0%, #f59e0b 100%); border:1px solid #ffd700; color:#000; font-family:'Orbitron', sans-serif; font-size:9.5px; font-weight:500; cursor:pointer; box-shadow:0 0 16px rgba(255,215,0,0.55);">
                    CONFIRMAR COMPRA
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE NOTIFICACIÓN DE ÉXITO -->
    <div id="shop-sleeve-notice-modal" style="display:none; position:fixed; inset:0; background:rgba(3,7,18,0.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
        <div style="background:#070d1b; border:1.5px solid #00f0ff; box-shadow:0 0 35px rgba(0,240,255,0.3), 0 10px 40px rgba(0,0,0,0.85); width:100%; max-width:420px; padding:22px 20px; text-align:center; box-sizing:border-box; color:#fff;">
            <div id="modal-sleeve-notice-title" style="font-family:'Orbitron', sans-serif; font-size:13px; font-weight:900; color:#00f0ff; letter-spacing:0.5px; margin-bottom:8px;">
                ¡COMPRA EXITOSA!
            </div>
            
            <div id="modal-sleeve-notice-msg" style="background:rgba(0,0,0,0.5); border:1px solid rgba(0,240,255,0.25); padding:10px; margin:10px 0 16px 0; font-size:10.5px; color:#cbd5e1; line-height:1.4;">
                <!-- Dinámico -->
            </div>

            <div style="display:flex; justify-content:center; gap:10px;">
                <button type="button" onclick="closeSleeveNoticeModal()" style="padding:7px 20px; background:linear-gradient(135deg, rgba(0,240,255,0.3), rgba(0,180,216,0.6)); border:1px solid var(--accent-cyan); color:#fff; font-family:'Orbitron', sans-serif; font-size:9.5px; font-weight:500; cursor:pointer;">
                    ACEPTAR
                </button>
            </div>
        </div>
    </div>

    <!-- NAVBAR INFERIOR Y SCRIPTS -->
    <div id="navbar-container"></div>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/navbar.js"></script>
    <script src="../../js/data/sleeves-data.js"></script>
    <script src="../../js/views/shop-fundas.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppNavbar) window.AppNavbar.init('tienda');
        });
    </script>
</body>
</html>
