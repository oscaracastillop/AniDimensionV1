<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Detalle de Sobre</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/shop.css?v=4.0">
    <link rel="stylesheet" href="../../css/navbar.css">
    <script src="../../js/core/modal-utils.js"></script>
    <style>
        .detail-page-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: transparent !important;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* UNIFIED SCROLL CONTAINER FOR THE WHOLE PAGE */
        .cards-catalog-scroll {
            flex: 1;
            padding: 10px 16px 90px 16px;
            overflow-y: auto;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        /* HEADER QUE SUBE CON EL SCROLL */
        .shop-header-scroll {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px 10px 2px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            margin-bottom: 8px;
        }

        .shop-title-responsive {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .shop-subtitle-responsive {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* PANEL SHOWCASE DESLIZABLE */
        .pack-showcase-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(9, 13, 22, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            padding: 12px 18px;
            margin: 4px 0 10px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        /* BARRA DE FILTROS DESLIZABLE */
        .filter-rarity-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0 10px 0;
            overflow-x: auto;
            margin-bottom: 8px;
        }

        .rarity-btn {
            padding: 5px 11px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9.5px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .rarity-btn:hover, .rarity-btn.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        #card-search-input {
            margin-left: auto;
            padding: 5px 10px;
            font-size: 10.5px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            outline: none;
            width: 180px;
            flex-shrink: 0;
        }

        /* REJILLA DE CARTAS RESPONSIVA */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 10px;
        }

        .catalog-card-item {
            background: radial-gradient(circle at 50% 50%, rgba(9, 13, 22, 0.98), rgba(2, 4, 8, 0.99));
            border: 1.2px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            position: relative;
            transition: all 0.2s ease;
            min-height: 180px;
            justify-content: space-between;
        }

        .catalog-card-item:hover {
            transform: translateY(-4px);
            border-color: #00f0ff;
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.4);
        }

        .owned-counter-tag {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #0f172a;
            border: 1px solid #10b981;
            color: #10b981;
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .unowned-counter-tag {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #0f172a;
            border: 1px solid #64748b;
            color: #64748b;
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* MEDIA QUERIES PARA ADAPTACIÓN MÓVIL Y TABLET */
        @media (max-width: 768px), (max-height: 500px) {
            .cards-catalog-scroll {
                padding: 6px 10px 85px 10px;
            }

            .shop-title-responsive {
                font-size: 12.5px;
            }

            .shop-subtitle-responsive {
                font-size: 8.5px;
            }

            .pack-showcase-panel {
                padding: 8px 12px;
                gap: 10px;
                margin-bottom: 6px;
            }

            .showcase-title-responsive {
                font-size: 12px !important;
            }

            .showcase-desc-responsive {
                font-size: 9px !important;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .showcase-stat-responsive {
                font-size: 8.5px !important;
            }

            .showcase-price-responsive {
                font-size: 11px !important;
            }

            .btn-buy-responsive {
                padding: 6px 12px !important;
                font-size: 9.5px !important;
                border-radius: 6px !important;
            }

            .filter-rarity-bar {
                padding-bottom: 6px;
                gap: 4px;
            }

            .rarity-btn {
                padding: 4px 7px;
                font-size: 8.5px;
            }

            #card-search-input {
                width: 125px;
                font-size: 9px;
                padding: 4px 6px;
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(98px, 1fr));
                gap: 7px;
            }

            .catalog-card-item {
                min-height: 150px;
                padding: 4px;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="detail-page-container">
        <!-- TODO EL CONTENIDO INTEGRADO EN UN SOLO SCROLL QUE SUBE CON LA PÁGINA -->
        <div class="cards-catalog-scroll">
            
            <!-- HEADER (SUBE CON EL SCROLL) -->
            <div class="shop-header-scroll">
                <div class="shop-title-box" style="display:flex; align-items:center; gap:10px;">
                    <img src="/assets/images/logo.png" alt="Ani-Dimension Logo" style="height:32px; width:auto; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,240,255,0.5));">
                    <div>
                        <h1 class="shop-title-responsive" id="pack-detail-title">DETALLE DE SOBRE</h1>
                        <div class="shop-subtitle-responsive" id="pack-detail-subtitle">CATÁLOGO COMPLETO DE CARTAS QUE PUEDEN SALIR EN ESTA EXPANSIÓN</div>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="shop-balance-pill">
                        <span>STARSHIPS:</span>
                        <span id="shop-user-coins">⭐ ---</span>
                    </div>
                    <a href="shop-sobres.html" class="btn-shop-back" title="Volver a Sobres">
                        VOLVER
                    </a>
                </div>
            </div>

            <!-- PANEL DESTACADO DEL SOBRE (SUBE CON EL SCROLL) -->
            <div id="pack-showcase-panel" class="pack-showcase-panel"></div>

            <!-- FILTROS Y BUSCADOR DE CARTAS (SUBE CON EL SCROLL) -->
            <div class="filter-rarity-bar">
                <button class="rarity-btn active" onclick="filterRarity('ALL')">Todas (<span id="count-all">0</span>)</button>
                <button class="rarity-btn" onclick="filterRarity('SECRET_RARE')">💎 Secret Rare (<span id="count-secret">0</span>)</button>
                <button class="rarity-btn" onclick="filterRarity('ULTRA_RARE')">🌟 Ultra Rare (<span id="count-ultra">0</span>)</button>
                <button class="rarity-btn" onclick="filterRarity('SUPER_RARE')">✨ Super Rare (<span id="count-super">0</span>)</button>
                <button class="rarity-btn" onclick="filterRarity('RARE')">🔹 Rare (<span id="count-rare">0</span>)</button>
                <button class="rarity-btn" onclick="filterRarity('COMMON')">📄 Common (<span id="count-common">0</span>)</button>
                <input type="text" id="card-search-input" placeholder="Buscar por nombre/ID..." oninput="filterCards()">
            </div>

            <!-- REJILLA DESLIZABLE DE CARTAS -->
            <div id="cards-grid-container" class="cards-grid"></div>
        </div>
    </div>

    <!-- MODAL DE INSPECCIÓN DETALLADA DE CARTA -->
    <div id="card-inspect-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); align-items:center; justify-content:center;">
        <div class="modal-backdrop" onclick="closeCardInspectModal()" style="position:absolute; inset:0;"></div>
        <div class="inspect-modal-card" style="position:relative; z-index:2; background:linear-gradient(135deg, rgba(20,20,35,0.98), rgba(10,10,20,0.98)); border:1.5px solid #00f0ff; box-shadow:0 0 25px rgba(0,240,255,0.4); border-radius:12px; width:92%; max-width:640px; padding:18px; color:#fff;">
            <button class="btn-close-modal" onclick="closeCardInspectModal()" title="Cerrar ventana" style="position:absolute; top:10px; right:12px; background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer; font-weight:800;">✕</button>
            <div class="inspect-modal-content" style="display:flex; gap:16px; align-items:flex-start;">
                <div class="inspect-image-col" style="flex-shrink:0; text-align:center;">
                    <img id="modal-card-img" src="" alt="Carta" style="width:130px; border-radius:6px; box-shadow:0 0 12px rgba(0,0,0,0.8);">
                    <div id="modal-card-passcode" style="font-family:'Orbitron',sans-serif; font-size:9px; color:#64748b; margin-top:6px;"></div>
                </div>
                <div class="inspect-info-col" style="flex:1; min-width:0;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <span id="modal-card-set" style="font-family:'Orbitron',sans-serif; font-size:9.5px; font-weight:800; color:#00f0ff;"></span>
                        <span id="modal-card-rarity" style="font-family:'Orbitron',sans-serif; font-size:9px; font-weight:900; padding:2px 6px; border:1px solid #ffd700; color:#ffd700;"></span>
                    </div>
                    <h2 id="modal-card-name" style="font-family:'Orbitron',sans-serif; font-size:13px; font-weight:900; color:#fff; margin:2px 0 6px 0;"></h2>
                    <div id="modal-card-stats-grid" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;"></div>
                    <div class="modal-card-desc-box" style="background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.1); padding:8px 10px; border-radius:6px; max-height:160px; overflow-y:auto;">
                        <div id="modal-card-desc" style="font-size:11px; line-height:1.45; color:#cbd5e1;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVBAR Y SCRIPTS -->
    <div id="navbar-container"></div>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/navbar.js"></script>
    <script src="../../js/data/packs-data.js"></script>
    <script src="../../js/views/shop-sobre-detalle.js"></script>
    <script>
        async function enforceLandscapeOrientation() {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ScreenOrientation) {
                    await window.Capacitor.Plugins.ScreenOrientation.lock({ orientation: 'landscape' });
                } else if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        document.addEventListener('DOMContentLoaded', () => {
            enforceLandscapeOrientation();
            if (window.AppNavbar) window.AppNavbar.init('tienda');
        });
    </script>
</body>
</html>
