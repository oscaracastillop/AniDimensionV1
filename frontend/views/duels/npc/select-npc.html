<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Selección de NPC (Yugi Muto)</title>
    <!-- Google Fonts: Outfit & Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/admin.css">
    <link rel="stylesheet" href="select-npc.css">
    <link rel="stylesheet" href="../../../css/navbar.css">
</head>
<body style="margin:0; padding:0; background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 55%, #e2e8f0 100%) !important; color:#0f172a; font-family:'Outfit', sans-serif;">

    <div class="npc-select-page-container">
        <!-- HEADER EN ESTILO ARENA / ADMINISTRACIÓN FIJO -->
        <div class="admin-header npc-select-header">
            <div class="admin-title-box">
                <div>
                    <h1 class="admin-title">SALA DE DUELOS VS NPC</h1>
                    <div class="admin-subtitle">DUELISTA NPC PRINCIPIANTE (NIVEL 1 - MAZO INICIAL)</div>
                </div>
            </div>
        </div>

        <!-- CONTENEDOR CENTRAL DESLIZABLE (SCROLL ULTRA-LIMPIO) -->
        <div class="npc-select-scroll-content">

        <!-- GRID COMPACTO DE NPCS (NPC NIVEL 1 PRINCIPIANTE) -->
        <div class="npc-grid" style="display:flex; justify-content:center; align-items:center; width:100%; min-height:220px;">

            <!-- LEVEL 1 - NPC PRINCIPIANTE -->
            <div class="npc-compact-card lvl-5" style="max-width:320px; width:100%;">
                <div class="npc-card-top">
                    <div class="npc-badge-lvl">LVL 1</div>
                    <div class="npc-avatar-box">
                        <div class="npc-icon-frame" style="border-radius:0;">
                            <img src="../../../assets/images/avatars/AVA-002.png" alt="NPC Principiante" class="npc-avatar-img" style="border-radius:0; object-fit:contain;">
                        </div>
                        <div class="npc-info-box">
                            <h3 class="npc-name">NPC Principiante</h3>
                            <div class="npc-title-diff">Novato (Deck Inicial 40 Cartas)</div>
                        </div>
                    </div>

                    <div class="npc-reward-badge">
                        <span class="reward-lbl">Recompensa:</span>
                        <strong class="reward-val">⭐ 10 / ⚡ 50</strong>
                    </div>
                </div>

                <a href="duel-npc.html?level=1" class="btn-challenge-npc">
                    <span>⚔️ DESAFIAR (LV. 1)</span>
                </a>
            </div>

        </div>

        </div> <!-- Fin de npc-select-scroll-content -->
    </div> <!-- Fin de npc-select-page-container -->

    <!-- NAVBAR INFERIOR Y AUTENTICACIÓN -->
    <div id="navbar-container"></div>
    <script src="../../../js/core/session.js"></script>
    <script src="../../../js/core/navbar.js"></script>
    <script>
        async function enforceLandscapeOrientation() {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ScreenOrientation) {
                    await window.Capacitor.Plugins.ScreenOrientation.lock({ orientation: 'landscape' });
                } else if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            enforceLandscapeOrientation();
            if (window.Session && !window.Session.isLoggedIn()) {
                window.Session.saveUser({ id: 999, username: 'Admin', role: 'admin' });
            }
            const user = window.Session ? window.Session.getUser() : null;
            if (user && user.username) {
                const nameEl = document.getElementById('select-npc-username');
                if (nameEl) nameEl.textContent = user.username;
            }
            if (window.AppNavbar) {
                window.AppNavbar.init('duels');
            }
        });
    </script>
</body>
</html>
