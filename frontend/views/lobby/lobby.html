<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Portal Informativo y Eventos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/lobby.css?v=5.0">
    <link rel="stylesheet" href="lobby.css?v=5.0">
    <link rel="stylesheet" href="../../css/navbar.css">
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/modal-utils.js"></script>
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div id="welcome-lobby-overlay">
        <!-- CONTENEDOR PRINCIPAL DEL LOBBY -->
        <div class="lobby-main-container">
            
            <!-- HEADER SUPERIOR FRANJA DE LADO A LADO (ESTILO UNIFICADO) -->
            <div class="lobby-info-header">
                <div style="display:flex; align-items:center; gap:14px;">
                    <img src="../../assets/images/logo.png" alt="Ani-Dimension Logo" style="height:40px; width:auto; object-fit:contain; filter:drop-shadow(0 0 10px rgba(0,240,255,0.65));">
                    <div>
                        <h1 class="lobby-portal-title">PORTAL DE NOTICIAS Y EVENTOS</h1>
                        <div class="lobby-portal-subtitle">NOVEDADES OFICIALES, PARCHES DE SISTEMA Y TORNEOS ANI DIMENSION</div>
                    </div>
                </div>

                <a href="/views/guide/guide.html" class="btn-lobby-guide">
                    <span>GUÍA DEL DUELISTA / ¿CÓMO JUGAR?</span>
                </a>
            </div>

            <!-- SECCIONES INFORMATIVAS FLOTANDO DIRECTAMENTE EN EL FONDO BLANCO -->
            <div class="lobby-grid-sections">
                <!-- 1. AVISOS DE NUEVOS EVENTOS -->
                <div class="lobby-column">
                    <div class="lobby-section-title">
                        <span>PRÓXIMOS EVENTOS Y TORNEOS</span>
                    </div>
                    <div id="lobby-events-container">
                        <div style="color:#64748b; font-size:11px;">Cargando avisos de eventos mundiales...</div>
                    </div>
                </div>

                <!-- 2. NUEVAS ACTUALIZACIONES Y NOTAS DE VERSIÓN -->
                <div class="lobby-column">
                    <div class="lobby-section-title">
                        <span>NOTAS DE PARCHE Y MEJORAS</span>
                    </div>
                    <div id="lobby-updates-container">
                        <div style="color:#64748b; font-size:11px;">Cargando notas de parches...</div>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/socket.js"></script>
    <script src="../../js/core/navbar.js"></script>
    <script src="../../js/views/lobby.js"></script>
</body>
</html>
