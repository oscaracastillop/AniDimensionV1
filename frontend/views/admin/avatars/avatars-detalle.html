<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Gestión y Edición de Avatar (Admin)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/shop.css?v=2.5">
    <link rel="stylesheet" href="../../../css/admin.css">
    <link rel="stylesheet" href="../cards/cards-detalle.css?v=2.5">
    <link rel="stylesheet" href="../../../css/navbar.css">
</head>
<body style="margin:0; padding:0; background: radial-gradient(circle at 50% 25%, #0d1f42 0%, #050b18 60%, #020408 100%) !important; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="admin-page-container" style="display:flex; flex-direction:column; width:100vw; height:100vh; overflow:hidden;">
        
        <!-- HEADER FIJO CON BOTÓN VOLVER -->
        <div class="shop-header" style="display:flex; justify-content:space-between; align-items:center; padding:6px 16px; border-bottom:1px solid rgba(0, 240, 255, 0.25);">
            <div class="shop-title-box" style="display:flex; align-items:center; gap:10px;">
                <a href="avatars.html" class="btn-shop-back" title="Volver al Catálogo de Avatares Admin">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px; height:16px;"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </a>
                <div>
                    <h1 id="admin-avatar-detail-title" class="shop-title" style="font-family:'Orbitron', sans-serif; font-size:15px; font-weight:900; color:#fff; margin:0; text-shadow:0 0 10px rgba(0,240,255,0.5);">FORMULARIO DE EDICIÓN Y CREACIÓN DE AVATAR</h1>
                    <div class="shop-subtitle" style="font-size:9.5px; color:#94a3b8; margin-top:1px;">PANEL LATERAL DEDICADO DE PERSONALIZACIÓN DE AVATAR, POTENCIADORES Y ESTADO</div>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:10px;">
                <button onclick="switchToNewAvatarForm()" style="padding:5px 12px; font-family:'Orbitron', sans-serif; font-size:9.5px; font-weight:900; color:#020617; background:linear-gradient(135deg, #00f0ff, #0072ff); border:none; border-radius:4px; cursor:pointer; box-shadow:0 0 10px rgba(0,240,255,0.4);">
                    ➕ NUEVO AVATAR
                </button>
                <div class="shop-balance-pill" style="background:rgba(15,23,42,0.85); border:1px solid #ffd700; color:#ffd700; font-family:'Orbitron', sans-serif; font-size:10.5px; font-weight:800; padding:4px 12px; border-radius:20px;">
                    ⚡ PANEL ADMIN AVATAR
                </div>
            </div>
        </div>

        <!-- CONTENEDOR CENTRAL DESLIZABLE (LAYOUT DISPUESTO CON CARD A LA IZQUIERDA Y FORMULARIO A LA DERECHA) -->
        <div class="shop-scroll-content" style="flex:1; padding:16px 20px 90px 20px; overflow-y:auto;">
            
            <div style="display:flex; gap:24px; justify-content:center; align-items:flex-start; max-width:980px; margin:0 auto; flex-wrap:wrap;">
                
                <!-- LADO IZQUIERDO: VISTA PREVIA EN VIVO DE LA CARD DE AVATAR -->
                <div style="flex:0 0 280px; display:flex; flex-direction:column; align-items:center;">
                    <div style="font-family:'Orbitron', sans-serif; font-size:11px; font-weight:900; color:#00f0ff; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; gap:6px;">
                        <span>👁️ VISTA PREVIA EN VIVO</span>
                    </div>

                    <div id="admin-avatar-preview-card" style="width:260px; background:linear-gradient(180deg, #0e172a 0%, #060a14 100%); border:2px solid #00f0ff; border-radius:10px; padding:16px; text-align:center; box-shadow:0 0 25px rgba(0,240,255,0.25); position:relative; overflow:hidden;">
                        <!-- SE INYECTA DINÁMICAMENTE DESDE admin-avatars-detail.js -->
                    </div>
                </div>

                <!-- LADO DERECHO: FORMULARIO ELEGANTE Y COMPLETO -->
                <div style="flex:1; min-width:320px; max-width:600px; background:linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(7, 12, 24, 0.98)); border:1.5px solid rgba(0,240,255,0.35); border-radius:10px; padding:20px; box-shadow:0 0 25px rgba(0,240,255,0.15);">
                    <div id="admin-avatar-form-panel">
                        <!-- SE INYECTA DINÁMICAMENTE DESDE admin-avatars-detail.js -->
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- NAVBAR Y SCRIPTS -->
    <div id="navbar-container"></div>
    <script src="../../../js/core/session.js"></script>
    <script src="../../../js/core/navbar.js"></script>
    <script src="../../../js/core/modal-utils.js"></script>
    <script src="../../../js/data/avatars-data.js"></script>
    <script src="../../../js/views/admin-avatars-detail.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppNavbar) window.AppNavbar.init('administracion');
        });
    </script>
</body>
</html>
