<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Módulo de Gestión de Usuarios</title>
    <link rel="stylesheet" href="/css/global.css?v=4.0">
    <link rel="stylesheet" href="/css/admin.css?v=4.0">
    <link rel="stylesheet" href="/css/rankings.css?v=4.0">
    <link rel="stylesheet" href="/css/navbar.css?v=4.0">
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="admin-page-container">
        
        <div class="admin-header">
            <div class="admin-title-box">
                <img src="/assets/images/logo.png" alt="Ani-Dimension Logo" style="height:32px; width:auto; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,240,255,0.5));">
                <div>
                    <h1 class="admin-title">MÓDULO DE GESTIÓN DE USUARIOS</h1>
                    <div class="admin-subtitle">ADMINISTRACIÓN INTEGRAL DE DUELISTAS, CREACIÓN, EDICIÓN Y BANEO</div>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <button type="button" onclick="openCreateUserModal()" class="btn-act-sm btn-act-activate" style="height:28px; padding:0 14px; font-size:9.5px;">
                    CREAR NUEVO USUARIO
                </button>
                <a href="../admin.html" class="btn-shop-back" title="Volver a la Consola Principal Admin">
                    VOLVER
                </a>
            </div>
        </div>

        <!-- CONTENEDOR DESLIZABLE CENTRAL UNIFICADO -->
        <div class="admin-scroll-content">
            <!-- CAJA DEL MÓDULO CON BUSCADOR Y TABLA DE USUARIOS -->
            <div id="admin-users-module" class="admin-card-section" style="min-height: calc(100vh - 125px); margin: 0 0 16px 0;">
                <div class="admin-section-header">
                    <div class="admin-section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px; height:16px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>LISTADO DE DUELISTAS REGISTRADOS</span>
                    </div>

                    <!-- BUSCADOR DINÁMICO EN TIEMPO REAL -->
                    <div class="admin-search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px; height:13px; color:var(--accent-cyan);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="admin-user-search" name="query_search_users_filter" class="admin-search-input" placeholder="Buscar por usuario, correo, país..." value="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="onAdminSearchInput(this)">
                    </div>
                </div>

                <!-- TABLA DE USUARIOS CON REGISTROS LIMPIOS Y FUENTE ELEGANTE -->
                <div class="admin-table-container">
                    <table class="admin-users-table">
                        <thead>
                            <tr>
                                <th style="width:45px;">POS</th>
                                <th>USUARIO</th>
                                <th>CORREO ELECTRÓNICO</th>
                                <th>PAÍS</th>
                                <th>NIVEL</th>
                                <th>ESTADO</th>
                                <th>EXP. BANEO</th>
                                <th>MOTIVO BANEO</th>
                                <th style="width:190px; text-align:center;">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="admin-users-tbody">
                            <tr><td colspan="9" style="text-align:center; color:#94a3b8; padding:24px;">Cargando catálogo de usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- CONTROLES DE PAGINACIÓN A 10 REGISTROS POR PÁGINA -->
                <div id="admin-users-pagination"></div>
            </div>
        </div>

    </div>

    <!-- ====================================================================== -->
    <!-- MODAL DE CREACIÓN DE NUEVO USUARIO POR EL ADMINISTRADOR -->
    <!-- ====================================================================== -->
    <div id="admin-create-user-modal" class="admin-modal-overlay" style="display:none;">
        <div class="admin-modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(16,185,129,0.3); padding-bottom:8px; margin-bottom:16px;">
                <div style="font-family:'Orbitron', sans-serif; font-size:13px; font-weight:700; color:#10b981; display:flex; align-items:center; gap:8px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px; height:18px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>CREAR NUEVO USUARIO DUELISTA</span>
                </div>
                <button onclick="closeCreateUserModal()" style="background:transparent; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="admin-form-group">
                    <label class="admin-form-label">USUARIO / NICK *</label>
                    <input type="text" id="create-user-username" class="admin-form-input" maxlength="15" placeholder="Ej. YugiMoto">
                </div>

                <div class="admin-form-group">
                    <label class="admin-form-label">CORREO ELECTRÓNICO *</label>
                    <input type="email" id="create-user-email" class="admin-form-input" placeholder="ejemplo@dominio.com">
                </div>
            </div>

            <div class="admin-form-group">
                <label class="admin-form-label">CONTRASEÑA *</label>
                <input type="password" id="create-user-password" class="admin-form-input" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="admin-form-group">
                <label class="admin-form-label">PAÍS CON BANDERA *</label>
                <select id="create-user-country" class="admin-form-select">
                    <option value="">Cargando países...</option>
                </select>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
                <div class="admin-form-group">
                    <label class="admin-form-label">NIVEL INICIAL</label>
                    <input type="number" id="create-user-nivel" class="admin-form-input" value="1" min="1" max="999">
                </div>

                <div class="admin-form-group">
                    <label class="admin-form-label">STARSHIPS</label>
                    <input type="number" id="create-user-starships" class="admin-form-input" value="5000" min="0">
                </div>

                <div class="admin-form-group">
                    <label class="admin-form-label">ROL DE ACCESO</label>
                    <select id="create-user-isadmin" class="admin-form-select">
                        <option value="0">DUELISTA NORMAL</option>
                        <option value="1">SUPER ADMIN (SA)</option>
                    </select>
                </div>
            </div>

            <div id="create-user-alert" style="display:none; font-size:10.5px; padding:8px; border-radius:6px; margin-bottom:12px;"></div>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
                <button onclick="closeCreateUserModal()" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#ccc; border-radius:0; padding:6px 14px; font-family:'Orbitron', sans-serif; font-size:9.5px; cursor:pointer;">CANCELAR</button>
                <button onclick="saveAdminUserCreate()" style="background:linear-gradient(135deg, rgba(16,185,129,0.3), rgba(16,185,129,0.6)); border:1px solid #10b981; color:#fff; font-family:'Orbitron', sans-serif; font-weight:700; border-radius:0; padding:6px 16px; font-size:9.5px; cursor:pointer; box-shadow:0 0 12px rgba(16,185,129,0.3);">CREAR USUARIO</button>
            </div>
        </div>
    </div>



    <script src="/js/core/session.js"></script>
    <script src="../../../js/core/modal-utils.js"></script>
    <script src="/js/core/navbar.js"></script>
    <script src="/js/views/admin-users.js"></script>
</body>
</html>
