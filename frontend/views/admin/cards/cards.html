<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ani-Dimension - Gerencia de Sobres y Cartas (Admin)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/global.css?v=4.0">
    <link rel="stylesheet" href="../../../css/shop.css?v=4.0">
    <link rel="stylesheet" href="../../../css/admin.css?v=4.0">
    <link rel="stylesheet" href="cards.css?v=4.0">
    <link rel="stylesheet" href="../../../css/navbar.css?v=4.0">
</head>
<body style="margin:0; padding:0; color:#fff; font-family:'Outfit', sans-serif;">

    <div class="admin-page-container" style="display:flex; flex-direction:column; width:100vw; height:100vh; overflow:hidden;">
        
        <!-- UNIFIED SCROLL CONTAINER -->
        <div class="shop-scroll-content" style="flex:1; padding:10px 16px 90px 16px; overflow-y:auto;">
            
            <!-- HEADER DE ADMINISTRACIÓN FIEL A LA TIENDA DE SOBRES -->
            <div class="shop-header" style="display:flex; justify-content:space-between; align-items:center; padding:4px 2px 10px 2px; border-bottom:1px solid rgba(0, 240, 255, 0.2); margin-bottom:12px;">
                <div class="shop-title-box" style="display:flex; align-items:center; gap:10px;">
                    <img src="/assets/images/logo.png" alt="Ani-Dimension Logo" style="height:32px; width:auto; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,240,255,0.5));">
                    <div>
                        <h1 class="shop-title">GERENCIA DE SOBRES Y CARTAS</h1>
                        <div class="shop-subtitle">ADMINISTRACIÓN DE EXPANSIONES, PRECIOS, BANNER DE OFERTAS, ESTADOS Y DROPS DE NPCS</div>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:8px;">
                    <a href="/views/duels/catalog.html" class="btn-shop-back" style="border-color:#ffd700; color:#ffd700;" title="Ver Catálogo y Álbum de Colección">
                        VER ÁLBUM / CATÁLOGO
                    </a>
                    <a href="../admin.html" class="btn-shop-back" title="Volver a la Consola Principal Admin">
                        VOLVER
                    </a>
                </div>
            </div>

            <!-- REJILLA PRINCIPAL DE SOBRES (RERENDERIZADA DINÁMICAMENTE CON FIEL FORMATO A LA TIENDA DE SOBRES) -->
            <div id="admin-packs-grid-container" class="shop-grid-container"></div>
        </div>
    </div>

    <!-- NAVBAR Y SCRIPTS -->
    <div id="navbar-container"></div>
    <script src="../../../js/core/session.js"></script>
    <script src="../../../js/core/navbar.js"></script>
    <script src="../../../js/core/modal-utils.js"></script>
    <script src="../../../js/data/packs-data.js"></script>
    <script src="../../../js/views/admin-cards.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppNavbar) window.AppNavbar.init('administracion');
        });
    </script>
</body>
</html>
